# Hapimatic public core — release workflow.
#
# This repository is a generated export. Each v<VERSION> tag pushed by the release publisher triggers
# this workflow, which builds the binaries from THIS public tree and creates the GitHub Release, so
# every published binary is built from the public source tagged alongside it (AGPL-3.0 §13).
#
# Two jobs (#5074). `build` runs the dependency install and the build with a read-only token and no
# persisted checkout credential, then hands the release files over as a workflow artifact. `publish`
# runs no repository or dependency code: it attests every release file (SLSA build provenance, signed
# by this workflow through GitHub's OIDC token) and then creates the Release, so dependency code never
# holds a write token or the OIDC token, and no Release exists without its attestations. Users verify
# a downloaded file with `gh attestation verify` (docs/guide/installation.md, "Verify the download").
#
# Actions are pinned to immutable commit SHAs (the repository requires it).
# Injection-safe: the only ${{ }} is secrets.GITHUB_TOKEN; the tag is read via the trusted
# $GITHUB_REF env var with quoted expansion (no github.event.* untrusted input).
name: Release

on:
  push:
    tags:
      - "v*"

# One release run at a time, in order (#5072). LATEST-SELECT reads the release list and then marks
# the highest tag Latest; two overlapping runs could interleave those two calls and leave an older
# tag Latest. The group serializes whole runs. queue: max keeps up to 100 waiting runs, first in,
# first out, and GitHub cancels any run past that. GitHub's default queue holds one pending run and
# cancels the older one, so the middle of three overlapping tag pushes would get no Release at all.
# cancel-in-progress: false never cancels the running one.
concurrency:
  group: public-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung run would hold the one-at-a-time public-release queue for GitHub's 6-hour default; a
    # normal run takes under two minutes (#5101 F4b).
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # #5138: the Bun every binary below is built with, the version sbom/hapimatic-core.cdx.json
      # declares as the embedded runtime. The release tooling that generates this repository fails
      # when the two differ. A quoted literal, not an expression: this file's only expression is
      # secrets.GITHUB_TOKEN. no-cache because pinning turns setup-bun's tool cache on: its post step
      # would save ~/.bun/bin/bun after this job's dependency code ran, and a re-run of this tag's
      # release would restore that binary.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
          no-cache: true
      # Frozen install proves the build reproduces from the committed lock with no re-resolution.
      - run: bun install --frozen-lockfile
      - run: bun run build:single-exe:all
      - name: Package release artifacts
        run: |
          cd cli/dist-exe
          mkdir -p ../release-artifacts

          # --- NOTICES-SHIP-BEGIN (#5128 R2) ---
          # Every binary carries the license notices it owes: the AGPL LICENSE, NOTICE, and
          # THIRD-PARTY-NOTICES.md (the license text of each bundled third-party component, the MPL
          # source pointers and the embedded Bun runtime's LGPL notice). They go INSIDE each archive,
          # beside the binary, because the one-command installer downloads only the archive; the
          # Release also carries THIRD-PARTY-NOTICES.md and a CycloneDX SBOM stamped with this version.
          # A tree missing any of them fails this step, so no Release ships without them.
          NOTICES=../../THIRD-PARTY-NOTICES.md
          SBOM=../../sbom/hapimatic-core.cdx.json
          for f in ../../LICENSE ../../NOTICE "$NOTICES" "$SBOM"; do
              if [ ! -f "$f" ]; then
                  echo "::error title=${f##*/} missing::${f#../../} is not in this source tree, so no Release is created (every binary ships with its license and third-party notices)."
                  exit 1
              fi
          done
          # --- NOTICES-SHIP-END ---

          for dir in bun-*/; do
              target="${dir%/}"
              # bun-darwin-arm64 -> hapi-darwin-arm64
              name="hapi-${target#bun-}"
              name="${name/windows/win32}"
              cp ../../LICENSE ../../NOTICE "$NOTICES" "$target"/

              if [[ "$target" == *"windows"* ]]; then
                  zip -j "../release-artifacts/${name}.zip" "$target"/hapi.exe \
                      "$target"/LICENSE "$target"/NOTICE "$target"/THIRD-PARTY-NOTICES.md
              else
                  tar -czvf "../release-artifacts/${name}.tar.gz" -C "$target" \
                      hapi LICENSE NOTICE THIRD-PARTY-NOTICES.md
              fi
          done

          # The Release copies (#5128 R2): the notices, and the SBOM with its version set to this tag's.
          # The committed SBOM carries no version on purpose, so a version bump never stales it.
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=unexpected tag::$GITHUB_REF is not a v<MAJOR>.<MINOR>.<PATCH> tag, so the SBOM cannot be stamped."
              exit 1
          fi
          cp "$NOTICES" ../release-artifacts/THIRD-PARTY-NOTICES.md
          jq --arg v "$VERSION" '.metadata.component.version = $v' "$SBOM" \
              > "../release-artifacts/hapimatic-core-${VERSION}.cdx.json"

          # --- INSTALLER-SHIP-BEGIN (#5069, #5072) ---
          # Ship the one-command installer under its own versioned name, install-hapimatic-v1.sh: the
          # public one-liner downloads releases/latest/download/install-hapimatic-v1.sh. Copied before
          # checksums.txt is written, so checksums.txt covers it. A tree without it fails this step, so no
          # Release is created (#5072): a green Release without the installer could become Latest and turn
          # the one-liner into a 404. One variable names the source, so a rename cannot update the copy and
          # miss the check.
          INSTALLER=../../scripts/install-hapimatic-v1.sh
          if [ ! -f "$INSTALLER" ]; then
              echo "::error title=install-hapimatic-v1.sh missing::scripts/install-hapimatic-v1.sh is not in this source tree, so no Release is created (the public one-liner downloads releases/latest/download/install-hapimatic-v1.sh)."
              exit 1
          fi
          # A symlink would ship whatever it points at, so the source must be the file itself (#5101 F4c).
          if [ -L "$INSTALLER" ]; then
              echo "::error title=install-hapimatic-v1.sh is a symlink::scripts/install-hapimatic-v1.sh is a symbolic link, so no Release is created (the Release ships the file itself, never a link's target)."
              exit 1
          fi
          cp "$INSTALLER" ../release-artifacts/install-hapimatic-v1.sh
          # --- INSTALLER-SHIP-END ---

          cd ../release-artifacts
          # `--` ends options (SC2035) while keeping bare filenames, so consumers can match
          # lines by asset name (e.g. grep " hapi-linux-arm64.tar.gz$" checksums.txt).
          sha256sum -- * > checksums.txt
      # Kept 7 days so "Re-run failed jobs" can repeat the publish job on these same files; after that
      # only "Re-run all jobs" works, which rebuilds them.
      - name: Hand the release files to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: cli/release-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30 # same reason as build (#5101 F4b)
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # No checkout and no dependency install in this job: it holds the write token and the OIDC token.
      - name: Receive the release files from the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: cli/release-artifacts
      # Every release file gets an attestation before the Release exists, so a failed attestation
      # creates no Release.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: cli/release-artifacts/*
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This job has no checkout, so gh is told the repository (gh help environment: GH_REPO).
          export GH_REPO="$GITHUB_REPOSITORY"
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" &>/dev/null; then
            # A re-run for the same tag. An immutable Release's assets cannot change (#5074), so its
            # published, already-attested assets stand; a mutable one gets this run's files.
            if [ "$(gh release view "$TAG" --json isImmutable -q .isImmutable)" = true ]; then
              echo "Release $TAG is immutable: its assets cannot change, so the published assets stand"
            else
              echo "Release $TAG already exists — uploading artifacts to it"
              gh release upload "$TAG" --clobber cli/release-artifacts/*
            fi
          else
            # Never Latest on creation; the block below decides Latest for every run (#5069).
            gh release create "$TAG" \
                --title "Release $TAG" \
                --generate-notes \
                --latest=false \
                cli/release-artifacts/*
          fi
          # --- LATEST-SELECT-BEGIN (#5069, #5072) ---
          # Latest = the highest vMAJOR.MINOR.PATCH among published releases. Both the installer's default
          # source and the public one-liner read releases/latest, so a re-published older tag
          # (docs/internal/open-core-release-runbook.md "Re-publishing a tag") must never take it. This
          # runs on both paths, after this run's own Release exists. On its own it cannot see a Release
          # another run publishes after its list read; the workflow's concurrency group serializes the runs
          # (#5072), so each read sees every earlier run's Release and Latest ends on the highest tag once
          # the last queued run finishes. A failed list read, tag filter, sort or edit fails the step; the
          # Release keeps the previous Latest, and a re-run recovers.
          if ! PUBLISHED="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName -q '.[].tagName')"; then
              echo "::error title=release list failed::could not read this repository's releases, so Latest cannot be decided"
              exit 1
          fi
          # This run's own tag is a candidate even before the list shows it. grep exits 1 when no line is a
          # vMAJOR.MINOR.PATCH tag (Latest is then left as it is); any other grep exit fails the step. The
          # default run shell is bash -e without pipefail, so neither failure may hide behind a later command.
          GREP_RC=0
          CANDIDATES="$({ printf '%s\n' "$TAG"; printf '%s\n' "$PUBLISHED"; } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')" || GREP_RC=$?
          if [ "$GREP_RC" -gt 1 ]; then
              echo "::error title=tag filter failed::grep exited $GREP_RC while filtering the release tags"
              exit 1
          fi
          HIGHEST=""
          if [ -n "$CANDIDATES" ]; then
              # sort is the last command of its pipeline, so a sort failure fails this assignment under bash -e.
              SORTED="$(printf '%s\n' "$CANDIDATES" | sort -V)"
              HIGHEST="${SORTED##*$'\n'}"
          fi
          if [ -n "$HIGHEST" ]; then
              # A second pin for the Package step's installer check (#5072): this run's own tag never
              # becomes Latest without the installer the one-liner downloads.
              if [ "$HIGHEST" = "$TAG" ] && [ ! -f cli/release-artifacts/install-hapimatic-v1.sh ]; then
                  echo "::error title=install-hapimatic-v1.sh missing::this run's release artifacts have no install-hapimatic-v1.sh, so $TAG is not made Latest"
                  exit 1
              fi
              gh release edit "$HIGHEST" --latest
              echo "Latest: $HIGHEST"
          fi
          # --- LATEST-SELECT-END ---
