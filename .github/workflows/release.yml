# Hapimatic public core — release workflow.
#
# This repository is a generated export. Each v<VERSION> tag pushed by the release publisher triggers
# this workflow, which builds the binaries from THIS public tree and creates the GitHub Release, so
# every published binary is built from the public source tagged alongside it (AGPL-3.0 §13).
#
# Actions are pinned to immutable commit SHAs.
# Injection-safe: the only ${{ }} is secrets.GITHUB_TOKEN; the tag is read via the trusted
# $GITHUB_REF env var with quoted expansion (no github.event.* untrusted input).
name: Release

on:
  push:
    tags:
      - "v*"

# One release run at a time, in order (#5072). LATEST-SELECT reads the release list and then marks
# the highest tag Latest; two overlapping runs could interleave those two calls and leave an older
# tag Latest. The group serializes whole runs. queue: max keeps up to 100 waiting runs, first in,
# first out, and GitHub cancels any run past that. GitHub's default queue holds one pending run and
# cancels the older one, so the middle of three overlapping tag pushes would get no Release at all.
# cancel-in-progress: false never cancels the running one.
concurrency:
  group: public-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Frozen install proves the build reproduces from the committed lock with no re-resolution.
      - run: bun install --frozen-lockfile
      - run: bun run build:single-exe:all
      - name: Package release artifacts
        run: |
          cd cli/dist-exe
          mkdir -p ../release-artifacts

          for dir in bun-*/; do
              target="${dir%/}"
              # bun-darwin-arm64 -> hapi-darwin-arm64
              name="hapi-${target#bun-}"
              name="${name/windows/win32}"

              if [[ "$target" == *"windows"* ]]; then
                  zip -j "../release-artifacts/${name}.zip" "$target"/hapi.exe
              else
                  tar -czvf "../release-artifacts/${name}.tar.gz" -C "$target" hapi
              fi
          done

          # --- INSTALLER-SHIP-BEGIN (#5069, #5072) ---
          # Ship the one-command installer under its own versioned name, install-hapimatic-v1.sh: the
          # public one-liner downloads releases/latest/download/install-hapimatic-v1.sh. Copied before
          # checksums.txt is written, so checksums.txt covers it. A tree without it fails this step, so no
          # Release is created (#5072): a green Release without the installer could become Latest and turn
          # the one-liner into a 404. One variable names the source, so a rename cannot update the copy and
          # miss the check.
          INSTALLER=../../scripts/install-hapimatic-v1.sh
          if [ ! -f "$INSTALLER" ]; then
              echo "::error title=install-hapimatic-v1.sh missing::scripts/install-hapimatic-v1.sh is not in this source tree, so no Release is created (the public one-liner downloads releases/latest/download/install-hapimatic-v1.sh)."
              exit 1
          fi
          cp "$INSTALLER" ../release-artifacts/install-hapimatic-v1.sh
          # --- INSTALLER-SHIP-END ---

          cd ../release-artifacts
          # `--` ends options (SC2035) while keeping bare filenames, so consumers can match
          # lines by asset name (e.g. grep " hapi-linux-arm64.tar.gz$" checksums.txt).
          sha256sum -- * > checksums.txt
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" &>/dev/null; then
            # A re-run for the same tag: refresh the assets on the existing Release.
            echo "Release $TAG already exists — uploading artifacts to it"
            gh release upload "$TAG" --clobber cli/release-artifacts/*
          else
            # Never Latest on creation; the block below decides Latest for every run (#5069).
            gh release create "$TAG" \
                --title "Release $TAG" \
                --generate-notes \
                --latest=false \
                cli/release-artifacts/*
          fi
          # --- LATEST-SELECT-BEGIN (#5069, #5072) ---
          # Latest = the highest vMAJOR.MINOR.PATCH among published releases. Both the installer's default
          # source and the public one-liner read releases/latest, so a re-published older tag
          # (docs/internal/open-core-release-runbook.md "Re-publishing a tag") must never take it. This
          # runs on both paths, after this run's own Release exists. On its own it cannot see a Release
          # another run publishes after its list read; the workflow's concurrency group serializes the runs
          # (#5072), so each read sees every earlier run's Release and Latest ends on the highest tag once
          # the last queued run finishes. A failed list read, tag filter, sort or edit fails the step; the
          # Release keeps the previous Latest, and a re-run recovers.
          if ! PUBLISHED="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName -q '.[].tagName')"; then
              echo "::error title=release list failed::could not read this repository's releases, so Latest cannot be decided"
              exit 1
          fi
          # This run's own tag is a candidate even before the list shows it. grep exits 1 when no line is a
          # vMAJOR.MINOR.PATCH tag (Latest is then left as it is); any other grep exit fails the step. The
          # default run shell is bash -e without pipefail, so neither failure may hide behind a later command.
          GREP_RC=0
          CANDIDATES="$({ printf '%s\n' "$TAG"; printf '%s\n' "$PUBLISHED"; } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')" || GREP_RC=$?
          if [ "$GREP_RC" -gt 1 ]; then
              echo "::error title=tag filter failed::grep exited $GREP_RC while filtering the release tags"
              exit 1
          fi
          HIGHEST=""
          if [ -n "$CANDIDATES" ]; then
              # sort is the last command of its pipeline, so a sort failure fails this assignment under bash -e.
              SORTED="$(printf '%s\n' "$CANDIDATES" | sort -V)"
              HIGHEST="${SORTED##*$'\n'}"
          fi
          if [ -n "$HIGHEST" ]; then
              # A second pin for the Package step's installer check (#5072): this run's own tag never
              # becomes Latest without the installer the one-liner downloads.
              if [ "$HIGHEST" = "$TAG" ] && [ ! -f cli/release-artifacts/install-hapimatic-v1.sh ]; then
                  echo "::error title=install-hapimatic-v1.sh missing::this run's release artifacts have no install-hapimatic-v1.sh, so $TAG is not made Latest"
                  exit 1
              fi
              gh release edit "$HIGHEST" --latest
              echo "Latest: $HIGHEST"
          fi
          # --- LATEST-SELECT-END ---
